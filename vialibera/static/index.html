<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#5f6368;--line:#dadce0;--accent:#0b57d0;--card:#f6f8fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#e8e8e8;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--card:#1e1f22}}
:root[data-theme="dark"]{--bg:#121212;--fg:#e8e8e8;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--card:#1e1f22}
/* wide, light scrollbars so they are easy to find */
:root{--sb-thumb:#8f959d;--sb-track:#e6e9ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sb-thumb:#c9ccd1;--sb-track:#2c2d31}}
:root[data-theme="dark"]{--sb-thumb:#c9ccd1;--sb-track:#2c2d31}
::-webkit-scrollbar{width:18px;height:18px}
::-webkit-scrollbar-track{background:var(--sb-track)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:9px;border:3px solid var(--sb-track);min-height:48px}
::-webkit-scrollbar-thumb:hover{background:var(--fg)}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:auto;scrollbar-color:var(--sb-thumb) var(--sb-track)}}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.5rem;display:flex;align-items:center;gap:10px}
.logo{height:44px;width:44px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
.bar button{margin-left:6px}
button{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#log{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:160px;max-height:calc(100vh - 330px);max-height:calc(100dvh - 330px);overflow-y:auto;margin:12px 0;white-space:pre-wrap;background:var(--card)}
.composer{position:sticky;bottom:0;background:var(--bg);padding:8px 0 12px;border-top:1px solid var(--line)}
.me{color:var(--accent);margin-bottom:8px}.bot{margin-bottom:12px}
#opts button{margin:4px 6px 4px 0;border-color:var(--accent);color:var(--accent);background:transparent;border-radius:16px}
input[type=text]{width:calc(100% - 100px);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--card);margin:12px 0}
label{display:block;margin:10px 0}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:.9rem}
.sim{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:10px;border:1px dashed #b26a00;color:#b26a00;margin-left:6px;vertical-align:middle}
.simnote{font-size:.85rem;color:#b26a00;margin:4px 0 8px}
.plans{display:flex;gap:8px;flex-wrap:wrap}.plans .card{flex:1 1 150px;margin:0;cursor:pointer}.plans .card.on{border-color:var(--accent);outline:2px solid var(--accent)}
.plans .card.tool,.card.tool{flex:1 1 240px;cursor:default;margin:6px 0}.card.tool>div{margin:3px 0}.by{font-size:.75em;letter-spacing:.04em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:0 5px}.by.miotem{color:var(--accent)}.by.partner{color:var(--muted)}
.tick{color:#188038}.todo{color:var(--muted)}.verify{color:#b06000;font-size:.85rem}.core-matched{color:#188038}.core-flagged{color:#b06000}.core-flagged_critical{color:#c5221f}
footer.legal{font-size:12px;opacity:.7;text-align:center;padding:16px 12px;line-height:1.6}footer.legal a{color:inherit}
</style></head><body>

  </div>

</div>

<div id="engage" class="card" hidden></div>

<div id="temws" class="card" hidden></div>

<div id="staff" class="card" hidden>

<div id="welcome" class="card" hidden>

</div>

          ok.disabled = !chosen.size;
        };
        $("opts").appendChild(b);
      });
      ok.onclick = () => { if (chosen.size) send([...chosen].join(", ")); };
      $("opts").appendChild(ok);
    } else if (last.startsWith("OPTIONS:")) {
      add("bot", lines.slice(0, -1).join("\n").trim(), true);
      last.slice(8).split("|").map(x => x.trim()).filter(Boolean).forEach(o => {
        const b = document.createElement("button"); b.textContent = o;
        b.onclick = () => /^(something else|altro|qualcos'altro)/i.test(o) ? $("msg").focus() : send(o);
        $("opts").appendChild(b);
      });
    } else if (last.startsWith("GOTO:")) {
      add("bot", lines.slice(0, -1).join("\n").trim(), true);
      const key = last.slice(5).trim().toLowerCase();
      if (["chat", "req", "duties", "docs", "eori", "tools"].includes(key)) { const b = document.createElement("button"); b.textContent = TL[lang].go; b.className = "primary"; b.onclick = () => goTo(key); $("opts").appendChild(b); }
    } else add("bot", reply, true);
  }
  async function send(text) {
    const m = (typeof text === "string" ? text : $("msg").value).trim(); if (!m) return;
    $("msg").value = ""; $("opts").innerHTML = ""; add("me", m);
    const [r, j] = await call("/chat", {message: m, case_id: caseId, lang, path_type: pathType});
    if (r.ok) {
      caseId = j.case_id; setPersona(j.persona); show(j.reply);
      if (j.account) { const k = {created: "account_created", access_requested: "account_access", invalid_vat: "account_invalid"}[j.account.status]; if (k) add("bot", "ℹ " + T[lang][k]); }
    } else if (j.error === "ai_unavailable") {  // AI service down (credit, overload, timeout): keep the message to resend
      add("bot", T[lang].ai_down); if (!$("msg").value) $("msg").value = m;
    } else add("bot", j.error === "forbidden" ? T[lang].forbidden : T[lang].err + (j.error || r.status));
  }
  $("send").onclick = () => send();
  $("msg").onkeydown = e => { if (e.key === "Enter") send(); };
  // Routes with a verified checklist. The server decides for real (requirements.covers); this only shows the notice early.
  const COVERED_PRODUCTS = ["pasta", "wine", "olive oil", "cheese and dairy"];
  const COVERED_COUNTRIES = ["UK", "USA", "Canada", "Switzerland", "Germany", "France", "Spain", "Netherlands", "Belgium", "Austria"];
  const PICK_PRODUCTS = ["wine", "pasta", "olive oil", "cheese and dairy", "other"];
  const PICK_COUNTRIES = ["UK", "USA", "Canada", "Switzerland", "EU", "other"];
  const EU_STATES = ["Germany", "France", "Spain", "Netherlands", "Belgium", "Austria", "other_eu"];
  let statusEl = null;  // the chat message that follows the checklist (step, next item, who)
  function quickStart(t) {  // first question: product, optional description, country. Straight into a project, no AI call
    const box = $("w-start"); box.innerHTML = "";
    if (me.tem) return;  // TEMs get their own start (to be designed)
    box.style.cssText = "margin:10px 0";
    box.appendChild(mk("h2", t.q_title)); box.appendChild(mk("div", t.q_help, "muted"));
    const lbl = x => { const d = mk("div", x); d.style.cssText = "font-weight:600;margin:12px 0 4px"; return d; };
    let prod = "";
    box.appendChild(lbl(t.q_prod));
    const chips = mk("div"); box.appendChild(chips);
    const op = mk("input"); op.placeholder = t.q_which_p; op.hidden = true; op.style.margin = "6px 6px 0 0";
    const desc = mk("input"); desc.placeholder = t.q_detail_ph; desc.setAttribute("aria-label", t.q_detail); desc.style.margin = "6px 0 0"; desc.style.width = "100%"; desc.style.boxSizing = "border-box";
    const ctry = mk("select"); ctry.setAttribute("aria-label", t.q_country);
    const e0 = mk("option", t.q_country + "…"); e0.value = ""; ctry.appendChild(e0);
    PICK_COUNTRIES.forEach(o => { const e = mk("option", t.q_countries[o]); e.value = o; ctry.appendChild(e); });
    const eu = mk("select"); eu.setAttribute("aria-label", t.q_eu_q); eu.hidden = true;
    EU_STATES.forEach(o => { const e = mk("option", t.q_countries[o]); e.value = o; eu.appendChild(e); });
    const oc = mk("input"); oc.placeholder = t.q_which_c; oc.hidden = true; oc.style.margin = "6px 6px 0 0";
    const euq = mk("div", t.q_eu_q); euq.hidden = true;
    const notice = mk("div", "", "notice"); notice.hidden = true; notice.style.cssText = "border:1px solid #f0c36d;background:#fdf6e3;color:#1a1c20;border-radius:8px;padding:10px 12px;margin:10px 0";
    const countryValue = () => { const c = ctry.value; if (c === "EU") return eu.value === "other_eu" ? "other" : eu.value; return c; };
    const refresh = () => {
      op.hidden = prod !== "other"; euq.hidden = eu.hidden = ctry.value !== "EU";
      oc.hidden = !(ctry.value === "other" || (ctry.value === "EU" && eu.value === "other_eu"));
      const c = countryValue();
      const known = prod && c;
      const covered = COVERED_PRODUCTS.includes(prod) && COVERED_COUNTRIES.includes(c);
      notice.hidden = !(known && !covered);
      if (!notice.hidden) { notice.innerHTML = ""; notice.appendChild(mk("strong", t.q_uc_h)); notice.appendChild(mk("div", t.q_uc_p)); }
    };
    PICK_PRODUCTS.forEach(k => { const b = mk("button", t.q_cats[k]); b.style.margin = "4px 6px 4px 0"; b.onclick = () => { prod = k; [...chips.children].forEach(x => x.style.borderColor = ""); b.style.borderColor = "var(--accent)"; refresh(); }; chips.appendChild(b); });
    ctry.onchange = refresh; eu.onchange = refresh;
    box.append(op, lbl(t.q_detail), desc, mk("div", t.q_detail_help, "muted"), lbl(t.q_country), ctry, euq, eu, oc, notice);
    const go = mk("button", t.q_start), msg = mk("div", "", "muted"); go.className = "primary"; go.style.marginTop = "8px";
    go.onclick = async () => {
      msg.textContent = "";
      if (!prod || !countryValue()) { msg.textContent = t.q_pick; return; }
      go.disabled = true;
      const [r, j] = await call("/start", {category: prod, country: countryValue(), description: desc.value, lang,
                                           other_product: op.value, other_country: oc.value || (ctry.value === "EU" ? "EU" : "")});
      go.disabled = false;
      if (!r.ok) {
        const t2 = T[lang];
        msg.textContent = j.error === "plan_limit"
          ? (j.plan === "esplora" && j.limit !== "uncovered" ? t2.q_limit_free : (j.limit === "uncovered" ? t2.q_limit_unc : t2.q_limit_cov))
          : (j.error || r.status);
        if (j.error === "plan_limit") { const ab = mk("button", t2.a_go); ab.style.marginLeft = "8px"; ab.onclick = () => { $("account").hidden = false; loadAccount(); $("account").scrollIntoView({behavior: "smooth"}); }; msg.appendChild(ab); }
        return;
      }
      caseId = j.case_id; pathType = j.path_type;
      $("welcome").hidden = true; $("app").hidden = false;
      if (j.requested) {
        const p = j.requested.product || (prod !== "other" ? t.q_cats[prod] : ""), c = j.requested.country || (countryValue() !== "other" ? t.q_countries[countryValue()] : "");
        add("bot", t.q_req.replace("{what}", [p, c].filter(Boolean).join(lang === "it" ? " verso " : " to ") || (lang === "it" ? "questa richiesta" : "this request")));
      } else { add("bot", j.covered ? t.q_ready : t.q_ready_sim); statusEl = j.covered ? $("log").lastElementChild : null; }
      $("journey").hidden = false; jsel = null; loadJourney();
    };
    const chat = mk("a", t.q_chat); chat.href = "#"; chat.style.marginLeft = "14px";
    chat.onclick = e => { e.preventDefault(); $("welcome").hidden = true; $("app").hidden = false; };
    box.append(go, chat, msg);
  }

  function welcome() {
    const t = T[lang];
    $("w-title").textContent = me.latest_case ? t.w_back : t.w_title;
    $("w-names").textContent = t.w_names; $("w-can").textContent = t.w_can; $("w-expect").textContent = t.w_expect;
    $("w-can").hidden = $("w-expect").hidden = !me.tem;  // old simulated-model promises (prices, packages); the first question replaces them
    $("w-invite").hidden = !invitedNote; if (invitedNote) $("w-invite").textContent = t[invitedNote] || TT[lang][invitedNote];
    const wl = $("w-listen"); wl.hidden = !cfg.voice; wl.textContent = t.w_listen; $("w-listen-note").textContent = cfg.voice ? t.w_listen_note : "";
    wl.onclick = async () => {
      wl.disabled = true;
      try {
        $("w-listen-note").textContent = t.w_listen_note;
        const [r, blob] = await call("/intro", {lang}, true);
        if (r.ok) await playOne(blob);
        else $("w-listen-note").textContent = t.v_err + " (" + (blob.error || r.status) + (blob.status ? " " + blob.status : "") + (blob.detail ? ": " + blob.detail : "") + ")";
      } catch (e) { $("w-listen-note").textContent = t.v_err + " (" + e.name + ": " + e.message + ")"; }
      wl.disabled = false;
    };
    quickStart(t);
    const box = $("w-opts"); box.innerHTML = "";
    const go = (label, path, text, resume) => {
      const b = document.createElement("button"); b.textContent = label; b.style.margin = "4px 6px 4px 0";
      b.onclick = () => { pathType = path; if (resume) caseId = me.latest_case; $("welcome").hidden = true; $("app").hidden = false; send(text); };
      box.appendChild(b);
    };
    if (me.latest_case) go(t.w_continue, 2, lang === "it" ? "Riprendiamo la mia pratica." : "Let us continue my case.", true);
    $("app").hidden = true; $("welcome").hidden = false;
  }
  window.vlRefresh = () => {  // redraw whatever is on screen in the new language
    if (!$("welcome").hidden) welcome();
    if (!$("journey").hidden) loadJourney();
    if (!$("invite").hidden) loadInvite();
    if (!$("team").hidden) loadTeam();
    if (!$("docs").hidden) { $("d-title").textContent = T[lang].d_title; $("d-help").textContent = T[lang].d_help; $("d-projt").textContent = T[lang].d_proj; loadDocs(); }
    if (curPersona) setPersona(curPersona);
  };
  welcome();
  if (me.tem) {  // a TEM starts in the consultant workspace, not the exporter welcome
    $("welcome").hidden = true; $("app").hidden = true; $("temws").hidden = false; loadTem().then(() => {
      if (invitedNote === "tem_joined") $("temws").prepend(mk("p", TT[lang].tem_joined, "tick")); });
  }
  try {  // back from Stripe: confirm with Stripe itself, so the result shows even before the webhook arrives
    const pid = localStorage.getItem("vl_paid"), cancelled = localStorage.getItem("vl_paycancel");
    if (pid || cancelled) {
      localStorage.removeItem("vl_paid"); localStorage.removeItem("vl_paycancel");
      $("welcome").hidden = true; $("app").hidden = false; $("journey").hidden = false; jsel = null;
      let r3, j3;
      if (pid) [r3, j3] = await call("/pay/confirm", {session_id: pid});
      await loadJourney();
      const t = T[lang], dn = $("j-done"); dn.innerHTML = "";
      if (cancelled) dn.appendChild(mk("p", t.j_cancelled));
      else if (!r3.ok) dn.appendChild(mk("p", t.err + (j3.error || r3.status)));
      else if (j3.status !== "paid") dn.appendChild(mk("p", t.j_paid_wait));
      else if (j3.kind === "plan") { dn.appendChild(mk("p", t.j_plan_ok + " " + j3.plan)); await loadJourney(); }
      else {
        dn.appendChild(mk("p", t.j_paid_ok + " " + t.j_ref + ": " + j3.ref.slice(-10)));
        if (j3.credit_used_cents) dn.appendChild(mk("p", t.j_credit + ": -" + eurc(j3.credit_used_cents) + " · " + t.j_pay_due + ": " + eurc(j3.payable_cents)));
        if (j3.deliverables) { dn.appendChild(mk("h3", t.j_delivered)); simMark(dn, j3.deliverables); j3.deliverables.data.forEach(x => dn.appendChild(mk("div", x.sample[lang]))); }
      }
    }
  } catch (e) {}
})();
</script></body></html>
