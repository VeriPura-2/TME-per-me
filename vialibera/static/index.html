<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Via Libera</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#5f6368;--line:#dadce0;--accent:#0b57d0;--card:#f6f8fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#e8e8e8;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--card:#1e1f22}}
:root[data-theme="dark"]{--bg:#121212;--fg:#e8e8e8;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--card:#1e1f22}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.5rem}
.bar button{margin-left:6px}
button{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#log{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:240px;margin:12px 0;white-space:pre-wrap;background:var(--card)}
.me{color:var(--accent);margin-bottom:8px}.bot{margin-bottom:12px}
#opts button{margin:4px 6px 4px 0;border-color:var(--accent);color:var(--accent);background:transparent;border-radius:16px}
input[type=text]{width:calc(100% - 100px);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--card);margin:12px 0}
label{display:block;margin:10px 0}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:.9rem}
</style></head><body>
<header>
  <h1>Via Libera</h1>
  <div class="bar">
    <button id="lang" aria-label="Language"></button>
    <button id="theme" aria-label="Theme"></button>
    <button id="docsbtn" hidden></button>
    <button id="logout" hidden></button>
  </div>
</header>
<p id="who" class="muted"></p>

<div id="gate" class="card" hidden>
  <p id="gate-intro"></p>
  <label><input type="checkbox" id="c1"> <span id="c1t"></span></label>
  <label><input type="checkbox" id="c2"> <span id="c2t"></span></label>
  <p class="muted" id="gate-ai"></p>
  <button id="accept" class="primary" disabled></button>
</div>

<div id="docs" class="card" hidden>
  <h2 id="d-title"></h2>
  <p class="muted" id="d-help"></p>
  <input type="file" id="d-file" multiple accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.csv,.txt">
  <label><input type="checkbox" id="d-proj"> <span id="d-projt"></span></label>
  <div id="d-list"></div>
</div>

<div id="welcome" class="card" hidden>
  <h2 id="w-title"></h2>
  <p id="w-names"></p>
  <p id="w-can"></p>
  <p id="w-expect"></p>
  <p class="muted" id="w-style"></p>
  <div id="w-styles"></div>
  <p><strong id="w-ask"></strong></p>
  <div id="w-opts"></div>
</div>

<div id="app" hidden>
  <div class="muted"><span id="persona"></span> <a href="#" id="switch"></a></div>
  <div id="log"></div>
  <div id="opts"></div>
  <input type="text" id="msg" autocomplete="off">
  <button id="send" class="primary"></button>
</div>
<div id="landing" hidden class="card">
  <p id="landing-t"></p>
  <button id="login" class="primary"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@auth0/auth0-spa-js@2.1.3/dist/auth0-spa-js.production.js"></script>
<script>
const T = {
  it: {
    signin: "Accedi / Registrati", signout: "Esci", send: "Invia", ph: "Racconta il tuo prodotto e il mercato",
    signed: "Accesso come ", landing: "Il tuo export manager con intelligenza artificiale per i prodotti alimentari italiani.",
    gateIntro: "Prima di iniziare, leggi e accetta le condizioni.",
    c1: 'Ho letto e accetto le <a href="/terms?lang=it" target="_blank">Condizioni del servizio</a> e l\'<a href="/terms?lang=it#privacy" target="_blank">Informativa sulla privacy</a>.',
    c2: "Approvo specificamente, ai sensi degli artt. 1341 e 1342 c.c., le clausole indicate nelle Condizioni (limitazione di responsabilità, sospensione e cessazione, modifiche unilaterali, legge applicabile e foro competente).",
    ai: "Stai dialogando con un assistente basato su intelligenza artificiale. Le verifiche di conformità sono controllate da personale VeriPura prima della consegna.",
    accept: "Accetto e continuo", err: "Errore: ", d_btn: "Documenti", d_title: "I tuoi documenti", d_help: "Carica i documenti che usi spesso (PDF, immagini, Word, Excel; max 10 MB). Ti proponiamo dove archiviarli e tu confermi. Restano privati per la tua azienda.", d_proj: "Solo questo progetto", d_confirm: "Conferma", d_add: "Aggiungi al progetto", d_open: "Scarica", d_product: "Prodotto", d_market: "Mercato", d_valid: "Scade il", d_proposed: "Archiviazione proposta", d_empty: "Nessun documento.", d_dup: "Già presente.", w_title: "Benvenuto in Via Libera", w_names: "Ti accompagna un export manager con intelligenza artificiale, scelto per te. Puoi cambiarlo quando vuoi.", p_suffix: "export manager con IA", p_switch: "Cambia export manager", w_style: "Come preferisci lavorare? (facoltativo)", s_brief: "Breve e diretto", s_steps: "Passo dopo passo, con spiegazioni", s_numbers: "Prima i numeri", w_back: "Bentornato. Riprendiamo da dove eravamo?",
    w_can: "Puoi esplorare come esportare i tuoi prodotti alimentari, capire quali regole, documenti, etichette e dazi servono per un mercato, e ricevere un pacchetto di servizi con prezzi chiari.",
    w_expect: "Ti guida un assistente con intelligenza artificiale: una domanda alla volta, puoi saltarne quante vuoi, e non paghi nulla finché non approvi un pacchetto. Il personale VeriPura controlla le verifiche di conformità.",
    w_ask: "Che cosa vuoi esplorare per primo?",
    w_first: "Esportare per la prima volta", w_market: "Un nuovo mercato per un prodotto che ho già", w_product: "Un nuovo prodotto per un mercato che già servo",
    w_req: "Cosa serve per un prodotto e un paese", w_q: "Ho una domanda", w_continue: "Riprendi la mia pratica", w_new: "Inizia una nuova pratica",
    account_created: "Account azienda creato dalla partita IVA.",
    account_access: "Esiste già un'azienda con questa partita IVA. Abbiamo inviato una richiesta di accesso al titolare.",
    account_invalid: "La partita IVA non risulta valida. Controlla il numero.", theme: ["Chiaro", "Scuro"]
  },
  en: {
    signin: "Sign in / Sign up", signout: "Sign out", send: "Send", ph: "Tell us about your product and market",
    signed: "Signed in as ", landing: "Your AI export manager for Italian food products.",
    gateIntro: "Before we start, please read and accept the terms.",
    c1: 'I have read and accept the <a href="/terms?lang=en" target="_blank">Terms of Service</a> and the <a href="/terms?lang=en#privacy" target="_blank">Privacy Notice</a>.',
    c2: "I specifically approve, under Articles 1341 and 1342 of the Italian Civil Code, the clauses listed in the Terms (limitation of liability, suspension and ending, changes to the terms, governing law and courts).",
    ai: "You are talking to an AI-based assistant. Compliance checks are reviewed by VeriPura staff before delivery.",
    accept: "Accept and continue", err: "Error: ", d_btn: "Documents", d_title: "Your documents", d_help: "Upload the documents you use often (PDF, images, Word, Excel; max 10 MB). We suggest where to file them and you confirm. They stay private to your company.", d_proj: "This project only", d_confirm: "Confirm", d_add: "Add to project", d_open: "Download", d_product: "Product", d_market: "Market", d_valid: "Expires", d_proposed: "Filing suggested", d_empty: "No documents.", d_dup: "Already uploaded.", w_title: "Welcome to Via Libera", w_names: "An AI export manager, chosen for you, will guide you. You can switch to someone else at any time.", p_suffix: "AI export manager", p_switch: "Meet someone else", w_style: "How would you like to work? (optional)", s_brief: "Brief and direct", s_steps: "Step by step, with explanations", s_numbers: "Numbers first", w_back: "Welcome back. Shall we pick up where we left off?",
    w_can: "You can explore how to export your food products, find out which rules, documents, labels and duties apply to a market, and get a package of services with clear prices.",
    w_expect: "An AI assistant guides you: one question at a time, you can skip as many as you like, and you pay nothing until you approve a package. VeriPura staff review compliance checks.",
    w_ask: "What would you like to explore first?",
    w_first: "Exporting for the first time", w_market: "A new market for a product I already have", w_product: "A new product for a market I already serve",
    w_req: "What is needed for one product and country", w_q: "I have a question", w_continue: "Continue my case", w_new: "Start a new case",
    account_created: "Company account created from your VAT number.",
    account_access: "A company with this VAT number already exists. We sent an access request to its owner.",
    account_invalid: "This VAT number does not look valid. Please check it.", theme: ["Light", "Dark"]
  }
};
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
let lang = store.get("vl_lang", "it");
let theme = store.get("vl_theme", "");
let ctx = {};
function applyTheme() {
  if (theme) document.documentElement.setAttribute("data-theme", theme); else document.documentElement.removeAttribute("data-theme");
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("theme").textContent = dark ? T[lang].theme[0] : T[lang].theme[1];
}
function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("lang").textContent = lang === "it" ? "EN" : "IT";
  $("logout").textContent = t.signout; $("docsbtn").textContent = t.d_btn; $("send").textContent = t.send; $("msg").placeholder = t.ph;
  $("landing-t").textContent = t.landing; $("login").textContent = t.signin;
  $("gate-intro").textContent = t.gateIntro; $("c1t").innerHTML = t.c1; $("c2t").textContent = t.c2;
  $("gate-ai").textContent = t.ai; $("accept").textContent = t.accept;
  if (ctx.email) $("who").textContent = t.signed + ctx.email;
  applyTheme();
}
$("lang").onclick = () => { lang = lang === "it" ? "en" : "it"; store.set("vl_lang", lang); applyLang(); };
$("theme").onclick = () => {
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  theme = dark ? "light" : "dark"; store.set("vl_theme", theme); applyTheme();
};
["c1", "c2"].forEach(id => $(id).onchange = () => $("accept").disabled = !($("c1").checked && $("c2").checked));
applyLang();

(async () => {
  const cfg = await (await fetch("/config.json")).json();
  const client = await auth0.createAuth0Client({
    domain: cfg.domain, clientId: cfg.client_id,
    authorizationParams: {audience: cfg.audience, redirect_uri: location.origin, ui_locales: lang}});
  const q = new URLSearchParams(location.search);
  if (q.has("code") && q.has("state")) {
    await client.handleRedirectCallback();
    history.replaceState({}, "", "/");
  }
  if (!(await client.isAuthenticated())) {
    $("landing").hidden = false;
    $("login").onclick = () => client.loginWithRedirect({authorizationParams: {ui_locales: lang}});
    return;
  }
  const u = await client.getUser();
  ctx.email = u.email; applyLang();
  $("logout").hidden = false; $("docsbtn").hidden = false;
  $("logout").onclick = () => client.logout({logoutParams: {returnTo: location.origin}});
  const call = async (path, body) => {
    const token = await client.getTokenSilently();
    const r = await fetch(path, {method: "POST", headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json"}, body: JSON.stringify(body)});
    return [r, await r.json()];
  };
  const me = (await call("/me", {}))[1];
  if (!me.consent) {
    $("gate").hidden = false;
    await new Promise(res => $("accept").onclick = async () => {
      const [r] = await call("/consent", {accept_terms: true, accept_onerous: true, lang});
      if (r.ok) { $("gate").hidden = true; res(); }
    });
  }
  $("app").hidden = false;
  let caseId = null;
  let pathType = 1;
  const add = (cls, t) => { const d = document.createElement("div"); d.className = cls; d.textContent = t; $("log").appendChild(d); };
  // ---- documents
  let types = [];
  const tname = id => { const t = types.find(x => x.id === id); return t ? t[lang] : id; };
  async function api(path, opt) {
    const token = await client.getTokenSilently();
    return fetch(path, {...opt, headers: {...(opt && opt.headers), "Authorization": "Bearer " + token}});
  }
  async function loadDocs() {
    const q = $("d-proj").checked && caseId ? "?case=" + caseId : "";
    const r = await api("/docs" + q); const j = await r.json(); types = j.types || [];
    const t = T[lang], box = $("d-list"); box.innerHTML = "";
    if (!(j.documents || []).length) { box.textContent = t.d_empty; return; }
    j.documents.forEach(d => {
      const row = document.createElement("div"); row.className = "card";
      const title = document.createElement("div"); title.textContent = d.filename; title.style.fontWeight = "600"; row.appendChild(title);
      if (d.status === "proposed") { const n = document.createElement("div"); n.className = "muted"; n.textContent = t.d_proposed; row.appendChild(n); }
      const sel = document.createElement("select");
      types.forEach(x => { const o = document.createElement("option"); o.value = x.id; o.textContent = x[lang]; if (x.id === d.doc_type) o.selected = true; sel.appendChild(o); });
      const mk = (ph, v) => { const i = document.createElement("input"); i.type = "text"; i.placeholder = ph; i.value = v || ""; i.style.width = "28%"; i.style.margin = "0 6px 6px 0"; return i; };
      const prod = mk(t.d_product, d.product), mkt = mk(t.d_market, d.market);
      const val = document.createElement("input"); val.type = "date"; val.value = d.valid_until || ""; val.title = t.d_valid;
      row.append(sel, " ", prod, mkt, val, document.createElement("br"));
      const btn = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.style.marginRight = "6px"; b.onclick = fn; row.appendChild(b); };
      const save = async confirm => { await api("/doc/" + d.id, {method: "POST", body: JSON.stringify({doc_type: sel.value, product: prod.value, market: mkt.value, valid_until: val.value, confirm})}); loadDocs(); };
      if (d.status === "proposed") btn(t.d_confirm, () => save(true)); else btn("OK", () => save(false));
      if (caseId) btn(t.d_add, async () => { await api("/doc/" + d.id, {method: "POST", body: JSON.stringify({link_case: caseId})}); loadDocs(); });
      btn(t.d_open, async () => { const rr = await api("/doc/" + d.id); const bl = await rr.blob(); const a = document.createElement("a"); a.href = URL.createObjectURL(bl); a.download = d.filename; a.click(); });
      box.appendChild(row);
    });
  }
  $("docsbtn").onclick = () => { const p = $("docs"); p.hidden = !p.hidden; if (!p.hidden) { $("d-title").textContent = T[lang].d_title; $("d-help").textContent = T[lang].d_help; $("d-projt").textContent = T[lang].d_proj; loadDocs(); } };
  $("d-proj").onchange = loadDocs;
  $("d-file").onchange = async e => {
    for (const f of e.target.files) {
      const r = await api("/upload", {method: "POST", body: f, headers: {"X-Filename": encodeURIComponent(f.name), "X-Case": caseId || ""}});
      if (!r.ok) { const j = await r.json(); add("bot", T[lang].err + f.name + ": " + (j.error || r.status)); }
    }
    e.target.value = ""; loadDocs();
  };
  function setPersona(p) {
    if (!p) return;
    $("persona").textContent = p.name + ", " + T[lang].p_suffix + " ·";
    $("switch").textContent = T[lang].p_switch;
  }
  $("switch").onclick = async e => {
    e.preventDefault();
    const [r, j] = await call("/profile", {switch: true, path_type: pathType});
    if (r.ok) setPersona(j.persona);
  };
  function show(reply) {
    const lines = reply.trimEnd().split("\n");
    const last = lines[lines.length - 1];
    if (last.startsWith("OPTIONS:")) {
      add("bot", lines.slice(0, -1).join("\n").trim());
      last.slice(8).split("|").map(x => x.trim()).filter(Boolean).forEach(o => {
        const b = document.createElement("button"); b.textContent = o;
        b.onclick = () => /^(something else|altro|qualcos'altro)/i.test(o) ? $("msg").focus() : send(o);
        $("opts").appendChild(b);
      });
    } else add("bot", reply);
  }
  async function send(text) {
    const m = (typeof text === "string" ? text : $("msg").value).trim(); if (!m) return;
    $("msg").value = ""; $("opts").innerHTML = ""; add("me", m);
    const [r, j] = await call("/chat", {message: m, case_id: caseId, lang, path_type: pathType});
    if (r.ok) {
      caseId = j.case_id; setPersona(j.persona); show(j.reply);
      if (j.account) { const k = {created: "account_created", access_requested: "account_access", invalid_vat: "account_invalid"}[j.account.status]; if (k) add("bot", "ℹ " + T[lang][k]); }
    } else add("bot", T[lang].err + (j.error || r.status));
  }
  $("send").onclick = () => send();
  $("msg").onkeydown = e => { if (e.key === "Enter") send(); };
  function welcome() {
    const t = T[lang];
    $("w-title").textContent = me.latest_case ? t.w_back : t.w_title;
    $("w-names").textContent = t.w_names; $("w-can").textContent = t.w_can; $("w-expect").textContent = t.w_expect; $("w-ask").textContent = t.w_ask;
    $("w-style").textContent = t.w_style;
    const sb = $("w-styles"); sb.innerHTML = "";
    ["brief", "steps", "numbers"].forEach(k => {
      const b = document.createElement("button"); b.textContent = t["s_" + k]; b.style.margin = "4px 6px 4px 0";
      b.onclick = async () => { await call("/profile", {style: k}); [...sb.children].forEach(x => x.style.borderColor = ""); b.style.borderColor = "var(--accent)"; };
      if (me.style === k) b.style.borderColor = "var(--accent)";
      sb.appendChild(b);
    });
    const box = $("w-opts"); box.innerHTML = "";
    const go = (label, path, text, resume) => {
      const b = document.createElement("button"); b.textContent = label; b.style.margin = "4px 6px 4px 0";
      b.onclick = () => { pathType = path; if (resume) caseId = me.latest_case; $("welcome").hidden = true; $("app").hidden = false; send(text); };
      box.appendChild(b);
    };
    if (me.latest_case) go(t.w_continue, 2, lang === "it" ? "Riprendiamo la mia pratica." : "Let us continue my case.", true);
    go(t.w_first, 1, lang === "it" ? "Vorrei esportare per la prima volta." : "I would like to export for the first time.");
    go(t.w_market, 3, lang === "it" ? "Vorrei valutare un nuovo mercato per un prodotto che ho già." : "I want to evaluate a new market for a product I already have.");
    go(t.w_product, 4, lang === "it" ? "Vorrei esportare un nuovo prodotto in un mercato che già servo." : "I want to export a new product to a market I already serve.");
    go(t.w_req, 1, lang === "it" ? "Vorrei sapere cosa serve per un prodotto e un paese." : "I would like to know what is needed for one product and country.");
    go(t.w_q, 1, lang === "it" ? "Ho una domanda." : "I have a question.");
    $("app").hidden = true; $("welcome").hidden = false;
  }
  welcome();
})();
</script></body></html>
