<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MioExport</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#5f6368;--line:#dadce0;--accent:#0b57d0;--card:#f6f8fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#e8e8e8;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--card:#1e1f22}}
:root[data-theme="dark"]{--bg:#121212;--fg:#e8e8e8;--muted:#9aa0a6;--line:#3c4043;--accent:#8ab4f8;--card:#1e1f22}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.5rem}
.bar button{margin-left:6px}
button{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#log{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:160px;max-height:calc(100vh - 330px);max-height:calc(100dvh - 330px);overflow-y:auto;margin:12px 0;white-space:pre-wrap;background:var(--card)}
.composer{position:sticky;bottom:0;background:var(--bg);padding:8px 0 12px;border-top:1px solid var(--line)}
.me{color:var(--accent);margin-bottom:8px}.bot{margin-bottom:12px}
#opts button{margin:4px 6px 4px 0;border-color:var(--accent);color:var(--accent);background:transparent;border-radius:16px}
input[type=text]{width:calc(100% - 100px);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--card);margin:12px 0}
label{display:block;margin:10px 0}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:.9rem}
.sim{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:10px;border:1px dashed #b26a00;color:#b26a00;margin-left:6px;vertical-align:middle}
.simnote{font-size:.85rem;color:#b26a00;margin:4px 0 8px}
.plans{display:flex;gap:8px;flex-wrap:wrap}.plans .card{flex:1 1 150px;margin:0;cursor:pointer}.plans .card.on{border-color:var(--accent);outline:2px solid var(--accent)}
.tick{color:#188038}.todo{color:var(--muted)}
</style></head><body>
<header>
  <h1>MioExport</h1>
  <div class="bar">
    <button id="lang" aria-label="Language"></button>
    <button id="theme" aria-label="Theme"></button>
    <button id="docsbtn" hidden></button>
    <button id="jbtn" hidden></button>
    <button id="ibtn" hidden></button>
    <button id="tbtn" hidden></button>
    <button id="logout" hidden></button>
  </div>
</header>
<p id="who" class="muted"></p>

<div id="gate" class="card" hidden>
  <p id="gate-intro"></p>
  <label><input type="checkbox" id="c1"> <span id="c1t"></span></label>
  <label><input type="checkbox" id="c2"> <span id="c2t"></span></label>
  <p class="muted" id="gate-ai"></p>
  <button id="accept" class="primary" disabled></button>
</div>

<div id="docs" class="card" hidden>
  <h2 id="d-title"></h2>
  <p class="muted" id="d-help"></p>
  <input type="file" id="d-file" multiple accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.csv,.txt">
  <label><input type="checkbox" id="d-proj"> <span id="d-projt"></span></label>
  <div id="d-list"></div>
</div>

<div id="journey" class="card" hidden>
  <h2 id="j-title"></h2>
  <h3 id="j-plans-t"></h3><div id="j-plans-sim"></div><div id="j-plans" class="plans"></div>
  <h3 id="j-req-t"></h3><div id="j-req"></div>
  <div id="j-eori"></div>
  <h3 id="j-pk-t"></h3><div id="j-pk"></div>
  <div id="j-done"></div>
</div>

<div id="invite" class="card" hidden>
  <h2 id="i-title"></h2>
  <p id="i-text"></p>
  <p><input type="text" id="i-link" readonly style="width:70%"> <button id="i-copy"></button></p>
  <p><strong id="i-bal"></strong> <span id="i-sim"></span></p>
  <div id="i-list"></div>
  <p class="muted" id="i-rules"></p>
</div>

<div id="team" class="card" hidden>
  <h2 id="t-title"></h2>
  <p id="t-co" class="muted"></p>
  <div id="t-list"></div>
  <div id="t-consent"></div>
  <div id="t-inv"></div>
  <p class="muted" id="t-rules"></p>
</div>

<div id="welcome" class="card" hidden>
  <h2 id="w-title"></h2>
  <p id="w-invite" class="muted" hidden></p>
  <button id="w-listen" class="primary" hidden></button> <span class="muted" id="w-listen-note"></span>
  <p id="w-names"></p>
  <p id="w-can"></p>
  <p id="w-expect"></p>
  <p class="muted" id="w-style"></p>
  <div id="w-styles"></div>
  <p><strong id="w-ask"></strong></p>
  <div id="w-opts"></div>
</div>

<div id="app" hidden>
  <div class="muted"><span id="persona"></span> <a href="#" id="switch"></a></div>
  <div id="log"></div>
  <div class="composer">
    <div id="opts"></div>
    <input type="text" id="msg" autocomplete="off">
    <button id="send" class="primary"></button>
  </div>
</div>
<div id="landing" hidden class="card">
  <p id="landing-t"></p>
  <button id="login" class="primary"></button>
</div>

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },

try { const q = new URLSearchParams(location.search); const ic = q.get("invite"); if (ic) localStorage.setItem("vl_invite", ic.slice(0, 40)); const tt = q.get("team"); if (tt) localStorage.setItem("vl_team", tt.slice(0, 80)); } catch (e) {}
let lang = store.get("vl_lang", "it");
let theme = store.get("vl_theme", "");
let ctx = {};
function applyTheme() {
  if (theme) document.documentElement.setAttribute("data-theme", theme); else document.documentElement.removeAttribute("data-theme");
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("theme").textContent = dark ? T[lang].theme[0] : T[lang].theme[1];
}
function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("lang").textContent = lang === "it" ? "EN" : "IT";
  $("logout").textContent = t.signout; $("docsbtn").textContent = t.d_btn; $("jbtn").textContent = t.j_btn; $("ibtn").textContent = t.i_btn; $("tbtn").textContent = t.t_btn; $("send").textContent = t.send; $("msg").placeholder = t.ph;
  $("landing-t").textContent = t.landing; $("login").textContent = t.signin;
  $("gate-intro").textContent = t.gateIntro; $("c1t").innerHTML = t.c1; $("c2t").textContent = t.c2;
  $("gate-ai").textContent = t.ai; $("accept").textContent = t.accept;
  if (ctx.email) $("who").textContent = t.signed + ctx.email;
  applyTheme();
}
$("lang").onclick = () => { lang = lang === "it" ? "en" : "it"; store.set("vl_lang", lang); applyLang(); if (window.vlRefresh) window.vlRefresh(); };
$("theme").onclick = () => {
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  theme = dark ? "light" : "dark"; store.set("vl_theme", theme); applyTheme();
};
["c1", "c2"].forEach(id => $(id).onchange = () => $("accept").disabled = !($("c1").checked && $("c2").checked));
applyLang();

(async () => {
  const cfg = await (await fetch("/config.json")).json();
  const client = await auth0.createAuth0Client({
    domain: cfg.domain, clientId: cfg.client_id,
    authorizationParams: {audience: cfg.audience, redirect_uri: location.origin, ui_locales: lang}});
  const q = new URLSearchParams(location.search);
  if (q.has("code") && q.has("state")) {
    await client.handleRedirectCallback();
    history.replaceState({}, "", "/");
  }
  if (!(await client.isAuthenticated())) {
    $("landing").hidden = false;
    $("login").onclick = () => client.loginWithRedirect({authorizationParams: {ui_locales: lang}});
    return;
  }
  const u = await client.getUser();
  ctx.email = u.email; applyLang();
  $("logout").hidden = false; $("docsbtn").hidden = false; $("jbtn").hidden = false; $("ibtn").hidden = false; $("tbtn").hidden = false;
  $("logout").onclick = () => client.logout({logoutParams: {returnTo: location.origin}});
  const call = async (path, body, raw) => {
    const token = await client.getTokenSilently();
    const r = await fetch(path, {method: "POST", headers: {"Authorization": "Bearer " + token, "Content-Type": "application/json"}, body: JSON.stringify(body)});
    return [r, raw ? (r.ok ? await r.blob() : await r.json().catch(() => ({}))) : await r.json()];
  };
  let invitedNote = "";
  try {  // a team invite is accepted before the terms gate: the company's acceptance may already cover the person

  } catch (e) {}
  const me = (await call("/me", {}))[1];
  if (me.consent_via === "company" && !invitedNote) invitedNote = "c_via";
  if (!me.consent) {
    $("gate").hidden = false;

    } else if (last.startsWith("OPTIONS:")) {
      add("bot", lines.slice(0, -1).join("\n").trim(), true);
      last.slice(8).split("|").map(x => x.trim()).filter(Boolean).forEach(o => {
        const b = document.createElement("button"); b.textContent = o;
        b.onclick = () => /^(something else|altro|qualcos'altro)/i.test(o) ? $("msg").focus() : send(o);
        $("opts").appendChild(b);
      });
    } else add("bot", reply, true);
  }
  async function send(text) {
    const m = (typeof text === "string" ? text : $("msg").value).trim(); if (!m) return;
    $("msg").value = ""; $("opts").innerHTML = ""; add("me", m);
    const [r, j] = await call("/chat", {message: m, case_id: caseId, lang, path_type: pathType});
    if (r.ok) {
      caseId = j.case_id; setPersona(j.persona); show(j.reply);
      if (j.account) { const k = {created: "account_created", access_requested: "account_access", invalid_vat: "account_invalid"}[j.account.status]; if (k) add("bot", "ℹ " + T[lang][k]); }
    } else add("bot", j.error === "forbidden" ? T[lang].forbidden : T[lang].err + (j.error || r.status));
  }
  $("send").onclick = () => send();
  $("msg").onkeydown = e => { if (e.key === "Enter") send(); };
  function welcome() {
    const t = T[lang];
    $("w-title").textContent = me.latest_case ? t.w_back : t.w_title;
    $("w-names").textContent = t.w_names; $("w-can").textContent = t.w_can; $("w-expect").textContent = t.w_expect; $("w-ask").textContent = t.w_ask;
    $("w-style").textContent = t.w_style;
    $("w-invite").hidden = !invitedNote; if (invitedNote) $("w-invite").textContent = t[invitedNote];
    const wl = $("w-listen"); wl.hidden = !cfg.voice; wl.textContent = t.w_listen; $("w-listen-note").textContent = cfg.voice ? t.w_listen_note : "";
    wl.onclick = async () => {
      wl.disabled = true;
      try {
        $("w-listen-note").textContent = t.w_listen_note;
        const [r, blob] = await call("/intro", {lang}, true);
        if (r.ok) await playOne(blob);
        else $("w-listen-note").textContent = t.v_err + " (" + (blob.error || r.status) + (blob.status ? " " + blob.status : "") + (blob.detail ? ": " + blob.detail : "") + ")";
      } catch (e) { $("w-listen-note").textContent = t.v_err + " (" + e.name + ": " + e.message + ")"; }
      wl.disabled = false;
    };
    const sb = $("w-styles"); sb.innerHTML = "";
    ["brief", "steps", "numbers"].forEach(k => {
      const b = document.createElement("button"); b.textContent = t["s_" + k]; b.style.margin = "4px 6px 4px 0";
      b.onclick = async () => { await call("/profile", {style: k}); [...sb.children].forEach(x => x.style.borderColor = ""); b.style.borderColor = "var(--accent)"; };
      if (me.style === k) b.style.borderColor = "var(--accent)";
      sb.appendChild(b);
    });
    const box = $("w-opts"); box.innerHTML = "";
    const go = (label, path, text, resume) => {
      const b = document.createElement("button"); b.textContent = label; b.style.margin = "4px 6px 4px 0";
      b.onclick = () => { pathType = path; if (resume) caseId = me.latest_case; $("welcome").hidden = true; $("app").hidden = false; send(text); };
      box.appendChild(b);
    };
    if (me.latest_case) go(t.w_continue, 2, lang === "it" ? "Riprendiamo la mia pratica." : "Let us continue my case.", true);
    go(t.w_first, 1, lang === "it" ? "Vorrei esportare per la prima volta." : "I would like to export for the first time.");
    go(t.w_market, 3, lang === "it" ? "Vorrei valutare un nuovo mercato per un prodotto che ho già." : "I want to evaluate a new market for a product I already have.");
    go(t.w_product, 4, lang === "it" ? "Vorrei esportare un nuovo prodotto in un mercato che già servo." : "I want to export a new product to a market I already serve.");
    go(t.w_req, 1, lang === "it" ? "Vorrei sapere cosa serve per un prodotto e un paese." : "I would like to know what is needed for one product and country.");
    go(t.w_q, 1, lang === "it" ? "Ho una domanda." : "I have a question.");
    $("app").hidden = true; $("welcome").hidden = false;
  }
  window.vlRefresh = () => {  // redraw whatever is on screen in the new language
    if (!$("welcome").hidden) welcome();
    if (!$("journey").hidden) loadJourney();
    if (!$("invite").hidden) loadInvite();
    if (!$("team").hidden) loadTeam();
    if (!$("docs").hidden) { $("d-title").textContent = T[lang].d_title; $("d-help").textContent = T[lang].d_help; $("d-projt").textContent = T[lang].d_proj; loadDocs(); }
    if (curPersona) setPersona(curPersona);
  };
  welcome();
})();
</script></body></html>
